name: Build Industrial Edge app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-app:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build and verify frontend
        run: |
          npm ci
          npm run build

      - name: Verify Industrial Edge tools
        run: |
          docker --version
          docker info
          iectl version

      - name: Build image and export .app
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          sed -i "s/version: \"1.0.9\"/version: \"1.0.${RUN_NUMBER}\"/" industrial-edge/build-app.yaml
          docker build -t performance-insight-dashboard:1.0.0 .
          iectl apply -f ./industrial-edge/build-app.yaml
          find exports -maxdepth 1 -type f -name '*.app' -print -quit | grep -q .

      - name: Upload Industrial Edge application
        uses: actions/upload-artifact@v4
        with:
          name: performance-insight-industrial-edge-app
          path: exports/*.app
          if-no-files-found: error
          retention-days: 30
